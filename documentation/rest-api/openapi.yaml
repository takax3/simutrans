# This YAML file is the source of truth. Regenerate openapi.json after editing it.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Simutrans Observer REST API
  version: 1.0.0
  description: |
    Read-only API for local software that observes the currently loaded map.
    The server listens only on the IPv4 and IPv6 loopback interfaces. Browser
    clients from any origin may read the API through CORS. Credentials are not
    supported.

    Company, line, and convoy IDs are references scoped to one `world_epoch`.
    Clients must refresh their lists after the epoch changes.
servers:
  - url: http://127.0.0.1:{port}
    description: IPv4 loopback
    variables:
      port:
        default: "13355"
        description: Port supplied with `-rest-api-port`.
  - url: http://[::1]:{port}
    description: IPv6 loopback
    variables:
      port:
        default: "13355"
        description: Port supplied with `-rest-api-port`.
tags:
  - name: API description
    description: Machine-readable descriptions of this API.
  - name: Companies
    description: Companies in the currently loaded map.
  - name: Lines
    description: Transport lines in the currently loaded map.
  - name: Convoys
    description: Information about convoys in the currently loaded map.
paths:
  /:
    options:
      operationId: preflightApiIndex
      summary: CORS preflight
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflight"
    get:
      tags: [API description]
      operationId: getApiIndex
      summary: Get API discovery information
      description: Returns links to the API resources and machine-readable OpenAPI documents.
      responses:
        "200":
          description: API discovery information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndex"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/openapi.yaml:
    options:
      operationId: preflightOpenApiYaml
      summary: CORS preflight
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflight"
    get:
      tags: [API description]
      operationId: getOpenApiYaml
      summary: Get the OpenAPI document as YAML
      responses:
        "200":
          description: This OpenAPI document encoded as UTF-8 YAML.
          content:
            application/yaml:
              schema:
                type: object
                additionalProperties: true
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/openapi.json:
    options:
      operationId: preflightOpenApiJson
      summary: CORS preflight
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflight"
    get:
      tags: [API description]
      operationId: getOpenApiJson
      summary: Get the OpenAPI document as JSON
      responses:
        "200":
          description: This OpenAPI document encoded as UTF-8 JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/companies:
    options:
      operationId: preflightCompanies
      summary: CORS preflight
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflight"
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: List companies
      description: Returns every company in ascending company ID order.
      responses:
        "200":
          description: Company snapshot.
          headers:
            X-Simutrans-World-Epoch:
              $ref: "#/components/headers/WorldEpoch"
            X-Simutrans-Snapshot-Sequence:
              $ref: "#/components/headers/SnapshotSequence"
            X-Simutrans-Sync-Step:
              $ref: "#/components/headers/SyncStep"
            X-Simutrans-Generated-At-Ms:
              $ref: "#/components/headers/GeneratedAtMs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/lines:
    options:
      operationId: preflightLines
      summary: CORS preflight
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflight"
    get:
      tags: [Lines]
      operationId: listLines
      summary: List transport lines
      description: Returns lines in ascending line ID order. Multiple filters are combined with AND.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/Waytype"
      responses:
        "200":
          description: Line snapshot.
          headers:
            X-Simutrans-World-Epoch:
              $ref: "#/components/headers/WorldEpoch"
            X-Simutrans-Snapshot-Sequence:
              $ref: "#/components/headers/SnapshotSequence"
            X-Simutrans-Sync-Step:
              $ref: "#/components/headers/SyncStep"
            X-Simutrans-Generated-At-Ms:
              $ref: "#/components/headers/GeneratedAtMs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/convoys:
    options:
      operationId: preflightConvoys
      summary: CORS preflight
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflight"
    get:
      tags: [Convoys]
      operationId: listConvoys
      summary: List convoys
      description: Returns display metadata for every convoy matching the optional waytype filter.
      parameters:
        - $ref: "#/components/parameters/Waytype"
      responses:
        "200":
          description: Convoy snapshot.
          headers:
            X-Simutrans-World-Epoch:
              $ref: "#/components/headers/WorldEpoch"
            X-Simutrans-Snapshot-Sequence:
              $ref: "#/components/headers/SnapshotSequence"
            X-Simutrans-Sync-Step:
              $ref: "#/components/headers/SyncStep"
            X-Simutrans-Generated-At-Ms:
              $ref: "#/components/headers/GeneratedAtMs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvoyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/convoy-positions:
    options:
      operationId: preflightConvoyPositions
      summary: CORS preflight
      responses:
        "204":
          $ref: "#/components/responses/CorsPreflight"
    get:
      tags: [Convoys]
      operationId: listConvoyPositions
      summary: List current convoy positions
      description: |
        Returns one CSV record per matching convoy. Coordinates are the current
        map position. Next coordinates and movement progress are intentionally
        outside this version of the API. `route_index` is empty while a convoy
        is in a depot.
      parameters:
        - $ref: "#/components/parameters/Waytype"
      responses:
        "200":
          description: Convoy position snapshot encoded as UTF-8 CSV with a header row.
          headers:
            X-Simutrans-World-Epoch:
              $ref: "#/components/headers/WorldEpoch"
            X-Simutrans-Snapshot-Sequence:
              $ref: "#/components/headers/SnapshotSequence"
            X-Simutrans-Sync-Step:
              $ref: "#/components/headers/SyncStep"
            X-Simutrans-Generated-At-Ms:
              $ref: "#/components/headers/GeneratedAtMs"
          content:
            text/csv:
              schema:
                type: string
              example: |-
                convoy_id,waytype,state,state_code,speed_kmh,x,y,z,route_index
                12,track,driving,6,80,123,45,0,27
                18,road,loading,7,0,140,51,0,4
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    CompanyId:
      name: company_id
      in: query
      required: false
      description: Filters lines by company ID. A valid but unused ID returns an empty list.
      schema:
        type: integer
        minimum: 0
        maximum: 15
    Waytype:
      name: waytype
      in: query
      required: false
      description: |
        Filters resources by waytype. `all` is the default. `rail` groups track,
        tram, monorail, maglev, and narrow-gauge resources.
      schema:
        type: string
        default: all
        enum:
          - all
          - rail
          - road
          - track
          - water
          - air
          - monorail
          - tram
          - maglev
          - narrowgauge
  headers:
    WorldEpoch:
      description: Changes when a map is created or loaded.
      schema:
        type: integer
        format: int64
        minimum: 0
    SnapshotSequence:
      description: Monotonically increasing identifier for API snapshots in this process.
      schema:
        type: integer
        format: int64
        minimum: 0
    SyncStep:
      description: Simutrans world synchronization step represented by the response.
      schema:
        type: integer
        format: int64
        minimum: 0
    GeneratedAtMs:
      description: Millisecond value from Simutrans' monotonic process clock when the snapshot was generated.
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    CorsPreflight:
      description: The browser may issue GET requests without credentials.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
            const: "*"
        Access-Control-Allow-Methods:
          schema:
            type: string
            const: GET, OPTIONS
        Access-Control-Allow-Headers:
          schema:
            type: string
            const: Accept, Content-Type
        Access-Control-Expose-Headers:
          schema:
            type: string
        Access-Control-Max-Age:
          schema:
            type: integer
            const: 86400
    BadRequest:
      description: The query parameter is malformed, duplicated, or unsupported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Only the GET method is supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: No world is currently loaded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ApiIndex:
      type: object
      required: [name, api_version, openapi, endpoints]
      properties:
        name:
          type: string
          const: Simutrans Observer REST API
        api_version:
          type: string
          const: v1
        openapi:
          type: object
          required: [yaml, json]
          properties:
            yaml:
              type: string
              const: /api/v1/openapi.yaml
            json:
              type: string
              const: /api/v1/openapi.json
          additionalProperties: false
        endpoints:
          type: object
          required: [companies, lines, convoys, convoy_positions]
          properties:
            companies:
              type: string
              const: /api/v1/companies
            lines:
              type: string
              const: /api/v1/lines
            convoys:
              type: string
              const: /api/v1/convoys
            convoy_positions:
              type: string
              const: /api/v1/convoy-positions
          additionalProperties: false
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false
    CompanyList:
      type: object
      required: [api_version, world_epoch, sync_step, snapshot_sequence, generated_at_ms, companies]
      properties:
        api_version:
          type: string
          const: v1
        world_epoch:
          type: integer
          format: int64
          minimum: 0
        sync_step:
          type: integer
          format: int64
          minimum: 0
        snapshot_sequence:
          type: integer
          format: int64
          minimum: 0
        generated_at_ms:
          type: integer
          format: int64
          minimum: 0
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Company"
      additionalProperties: false
    Company:
      type: object
      required:
        - id
        - name
        - public_service
        - ai_type
        - ai_active
        - locked
        - primary_color_index
        - secondary_color_index
      properties:
        id:
          type: integer
          minimum: 0
          maximum: 15
        name:
          type: string
        public_service:
          type: boolean
        ai_type:
          type: string
          enum: [human, goods, passenger, scripted, unknown]
        ai_active:
          type: boolean
          description: Whether AI processing is currently active for this company.
        locked:
          type: boolean
        primary_color_index:
          type: integer
          minimum: 0
          maximum: 255
        secondary_color_index:
          type: integer
          minimum: 0
          maximum: 255
      additionalProperties: false
    LineList:
      type: object
      required: [api_version, world_epoch, sync_step, snapshot_sequence, generated_at_ms, lines]
      properties:
        api_version:
          type: string
          const: v1
        world_epoch:
          type: integer
          format: int64
          minimum: 0
        sync_step:
          type: integer
          format: int64
          minimum: 0
        snapshot_sequence:
          type: integer
          format: int64
          minimum: 0
        generated_at_ms:
          type: integer
          format: int64
          minimum: 0
        lines:
          type: array
          items:
            $ref: "#/components/schemas/Line"
      additionalProperties: false
    Line:
      type: object
      required: [id, name, company_id, waytype, convoy_count, withdraw, color_index]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        company_id:
          type: integer
          minimum: 0
          maximum: 15
        waytype:
          $ref: "#/components/schemas/WaytypeName"
        convoy_count:
          type: integer
          minimum: 0
        withdraw:
          type: boolean
        color_index:
          type: integer
          minimum: 0
          maximum: 255
      additionalProperties: false
    ConvoyList:
      type: object
      required:
        - api_version
        - world_epoch
        - sync_step
        - snapshot_sequence
        - generated_at_ms
        - carunits_per_tile
        - convoys
      properties:
        api_version:
          type: string
          enum: [v1]
        world_epoch:
          type: integer
          format: int64
          minimum: 0
        sync_step:
          type: integer
          format: int64
          minimum: 0
        snapshot_sequence:
          type: integer
          format: int64
          minimum: 0
        generated_at_ms:
          type: integer
          format: int64
          minimum: 0
        carunits_per_tile:
          type: integer
          minimum: 1
        convoys:
          type: array
          items:
            $ref: "#/components/schemas/Convoy"
      additionalProperties: false
    Convoy:
      type: object
      required:
        - id
        - name
        - company_id
        - line_id
        - waytype
        - vehicle_count
        - length_carunits
      properties:
        id:
          type: integer
          minimum: 0
        name:
          type: string
        company_id:
          type: [integer, "null"]
          minimum: 0
          maximum: 15
        line_id:
          type: [integer, "null"]
          minimum: 0
        waytype:
          $ref: "#/components/schemas/WaytypeName"
        vehicle_count:
          type: integer
          minimum: 0
        length_carunits:
          type: integer
          minimum: 0
      additionalProperties: false
    WaytypeName:
      type: string
      enum:
        - road
        - track
        - water
        - air
        - monorail
        - tram
        - maglev
        - narrowgauge
        - unknown
